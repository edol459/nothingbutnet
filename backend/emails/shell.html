<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f5f1e8;">
<!-- Table shell + inline styles only: Gmail strips <style> blocks and Outlook
     ignores most modern CSS. {{body_html}} is built by emailer.body_to_html. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#f5f1e8;padding:32px 16px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="max-width:520px;background:#ffffff;border:1px solid #e0d9cc;border-radius:12px;">
      <tr><td style="padding:36px 32px 30px;">
        <p style="margin:0 0 6px;font:600 11px/1.4 -apple-system,Segoe UI,sans-serif;
                  letter-spacing:.12em;text-transform:uppercase;color:#e67e22;">ydkball</p>
        <h1 style="margin:0 0 20px;font:400 26px/1.3 Georgia,'Times New Roman',serif;color:#1a1a1a;">
          {{subject}}</h1>
        {{body_html}}
        <p style="margin:26px 0 0;">
          <a href="https://ydkball.net" style="display:inline-block;padding:12px 28px;
             background:#e67e22;color:#ffffff;text-decoration:none;border-radius:7px;
             font:600 15px/1 -apple-system,Segoe UI,sans-serif;">Open ydkball</a>
        </p>
      </td></tr>
    </table>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
      <tr><td align="center" style="padding:18px 24px 0;">
        <p style="margin:0 0 6px;font:400 12px/1.6 -apple-system,Segoe UI,sans-serif;color:#9a9185;">
          You're getting this because you have a ydkball account.<br>
          <a href="{{unsubscribe_url}}" style="color:#9a9185;text-decoration:underline;">Unsubscribe</a>
          &nbsp;·&nbsp;
          <a href="https://ydkball.net/privacy" style="color:#9a9185;text-decoration:underline;">Privacy</a>
        </p>
        <p style="margin:0;font:400 11px/1.5 -apple-system,Segoe UI,sans-serif;color:#b3aa9d;">
          {{postal_address}}</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body></html>
