<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ydkball · Higher or Lower</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo-icon.png">
<script>if(localStorage.getItem('ydkball_night')==='1')document.documentElement.classList.add('night-mode');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/night-mode.css">
<link rel="stylesheet" href="/site-nav.css">
<style>
  *,*::before,*::after{box-sizing:border-box; margin:0; padding:0}
  :root{
    --ink:#0c0c0d; --ink2:#2a2a2e; --ink3:#6b6b78; --ink4:#a8a8b3;
    --paper:#F5F0E8; --paper2:#eeecea; --paper3:#e5e2dc; --rule:#d8d5cf;
    --orange:#e8530a; --orange-lt:#fff0ea; --green:#1a7a4a; --green-lt:#e8f3ec;
    --red:#c0392b; --red-lt:#fbeceb; --card:#FCFBF8; --field:#fff;
    --ff-serif:'DM Serif Display',Georgia,serif;
    --ff-sans:'Instrument Sans',system-ui,sans-serif;
    --ff-mono:'DM Mono','Courier New',monospace;
    --nav-h:58px; font-size:15px;
  }
  html.night-mode{ --card:#222228; --field:#191920; --green-lt:#16271d; --red-lt:#2b1715; }
  html{overflow-x:clip}
  body{
    font-family:var(--ff-sans); background:var(--paper); color:var(--ink);
    min-height:100vh; min-height:100dvh; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  /* film grain, same as the rest of the site */
  body::before{
    content:''; position:fixed; inset:0; z-index:9999; pointer-events:none; opacity:.022;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  a{color:var(--orange); text-decoration:none}
  .hidden{display:none !important}

  .wrap{
    width:100%; max-width:960px; margin:0 auto; flex:1; min-height:0;
    padding:16px 16px 18px; display:flex; flex-direction:column;
  }

  /* ── HUD: the board being played + the streak ─────────────────── */
  .hud{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:12px}
  .hud-board{flex:1 1 auto; min-width:0}
  .hud-kicker{font-family:var(--ff-mono); font-size:10px; letter-spacing:.16em;
              text-transform:uppercase; color:var(--orange)}
  .hud-label{font-family:var(--ff-serif); font-size:clamp(24px,5.4vw,31px); line-height:1.08;
             color:var(--ink); display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  /* Scope is the thing a chain is most easily misread about — a run never restates
     its own axis, so "all-time" vs "one season" gets its own chip, not fine print. */
  .scope{font-family:var(--ff-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
         color:var(--orange); background:var(--orange-lt); border:1px solid #f6d8c8;
         border-radius:100px; padding:4px 10px; white-space:nowrap; flex-shrink:0}
  html.night-mode .scope{border-color:transparent}
  .hud-right{display:flex; align-items:center; gap:16px; flex-shrink:0}
  .hud-stat{text-align:right}
  .hud-n{font-family:var(--ff-serif); font-size:26px; line-height:1; color:var(--ink)}
  .hud-n.hot{color:var(--orange)}
  .hud-l{font-family:var(--ff-mono); font-size:9.5px; letter-spacing:.12em;
         text-transform:uppercase; color:var(--ink3); margin-top:3px}

  /* round pips — the run at a glance, and the share grid's on-screen twin */
  .pips{display:flex; gap:4px; align-items:center; margin-bottom:12px}
  .pip{flex:1 1 0; min-width:5px; height:4px; border-radius:2px;
       background:var(--paper3); transition:background .3s}
  .pip.won{background:var(--green)}
  .pip.lost{background:var(--red)}
  .pip.now{background:var(--orange)}

  /* ── the arena: two panels, anchor then challenger ────────────── */
  .arena{flex:1; min-height:0; display:flex; flex-direction:column; gap:10px}
  @media(max-height:860px){ .panel{min-height:148px} }
  .panel{
    position:relative; overflow:hidden; border-radius:16px; flex:1 1 0; min-height:182px;
    background:#17171c; color:#fff; isolation:isolate;
    box-shadow:0 1px 0 rgba(0,0,0,.04), 0 12px 34px rgba(20,16,10,.10);
  }
  /* Team colour wash, then a dark scrim that is heavy only under the type — the
     right half stays colourful so the panel reads as that team's card. */
  .panel::before{
    content:''; position:absolute; inset:0; z-index:0;
    background:
      linear-gradient(95deg, rgba(6,6,8,.90) 0%, rgba(6,6,8,.72) 24%,
                             rgba(6,6,8,.24) 54%, rgba(6,6,8,0) 74%),
      radial-gradient(120% 130% at 22% 112%, var(--c1,#2a2a32) 0%,
                      var(--c2,#111116) 55%, #0a0a0d 100%);
  }
  /* The art occupies the right column only. Letting it run full-bleed put the
     player's face directly under his own name. */
  .shot{
    position:absolute; z-index:1; right:0; top:0; width:52%; height:100%;
    object-fit:cover; object-position:52% 16%;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, rgba(0,0,0,.6) 34%, #000 62%);
            mask-image:linear-gradient(90deg, transparent 0, rgba(0,0,0,.6) 34%, #000 62%);
  }
  .pbody{position:relative; z-index:2; height:100%; padding:18px 20px;
         display:flex; flex-direction:column; justify-content:center; gap:2px;
         max-width:62%}
  .pteam{align-self:flex-start; font-family:var(--ff-mono); font-size:10px; letter-spacing:.15em;
         text-transform:uppercase; color:var(--chip-ink,#fff); background:var(--chip,#2a2a32);
         border:1px solid rgba(255,255,255,.22); border-radius:4px; padding:3px 8px; margin-bottom:5px}
  .pname{font-family:var(--ff-serif); font-size:clamp(23px,5.6vw,36px); line-height:1.04;
         letter-spacing:-.01em; text-wrap:balance}
  .pval{font-family:var(--ff-mono); font-weight:500; font-size:clamp(30px,7.4vw,48px);
        line-height:1.05; margin-top:6px; font-variant-numeric:tabular-nums;
        transition:color .3s}
  .pval.good{color:#5fd99a} .pval.bad{color:#ff8d7e}
  .pval.hidden-val{color:rgba(255,255,255,.34)}
  .punit{font-family:var(--ff-mono); font-size:12.5px; letter-spacing:.11em;
         text-transform:uppercase; color:rgba(255,255,255,.78); margin-top:7px}
  .pask{font-family:var(--ff-sans); font-size:14.5px; line-height:1.35; margin-top:9px;
        color:rgba(255,255,255,.80)}
  .pask b{font-weight:600; color:#fff}

  /* the seam: which stat you are comparing on */
  .seam{display:flex; align-items:center; gap:12px; flex-shrink:0}
  .seam-rule{flex:1; height:1px; background:var(--rule)}
  .seam-badge{font-family:var(--ff-mono); font-size:9.5px; letter-spacing:.18em;
              text-transform:uppercase; color:var(--ink3)}

  /* ── the calls ────────────────────────────────────────────────── */
  .calls{display:flex; gap:10px; margin-top:14px; max-width:420px}
  .call{
    flex:1 1 0; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 10px; border-radius:11px; cursor:pointer;
    font-family:var(--ff-sans); font-size:14px; font-weight:700; letter-spacing:.04em;
    background:rgba(255,255,255,.12); color:#fff; border:1.5px solid rgba(255,255,255,.26);
    backdrop-filter:blur(3px); transition:background .14s, border-color .14s, transform .1s;
  }
  .call:hover:not(:disabled){background:rgba(255,255,255,.24); border-color:#fff; transform:translateY(-1px)}
  .call:active:not(:disabled){transform:translateY(0)}
  .call:disabled{cursor:default; opacity:.45}
  .call .arrow{font-size:12px}
  .call.chosen{background:#fff; color:#121216; border-color:#fff}

  /* verdict chip over the challenger panel */
  .verdict{
    position:absolute; z-index:3; inset:auto 18px 18px auto;
    font-family:var(--ff-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    padding:7px 13px; border-radius:100px; font-weight:500;
    opacity:0; transform:translateY(6px); transition:opacity .22s, transform .22s;
  }
  .verdict.show{opacity:1; transform:translateY(0)}
  .verdict.good{background:#1a7a4a; color:#fff}
  .verdict.bad{background:#c0392b; color:#fff}

  @media(min-width:860px){
    .arena{flex-direction:row; align-items:stretch}
    .panel{min-height:400px}
    .seam{flex-direction:column; width:auto}
    .seam-rule{width:1px; height:auto; flex:1}
    .seam-badge{writing-mode:vertical-rl; text-orientation:mixed}
    .pbody{max-width:76%}
  }
  @media(max-width:520px){
    .pbody{padding:15px 16px; max-width:64%}
    .shot{width:48%}
  }

  /* ── cards (sign-in, result, paywall) ─────────────────────────── */
  .card{
    background:var(--card); border:1px solid var(--rule); border-radius:14px;
    padding:28px 24px; text-align:center;
    box-shadow:0 1px 0 rgba(0,0,0,.03), 0 10px 30px rgba(20,16,10,.06);
  }
  .resultlogo{height:44px; width:auto; margin-bottom:10px}
  .headline{font-family:var(--ff-serif); font-size:31px; line-height:1.08; color:var(--ink)}
  .headline.win{color:var(--orange)}
  .big{font-family:var(--ff-serif); font-size:64px; line-height:1; margin:12px 0 2px}
  .big small{font-size:26px; color:var(--ink3)}
  .sub{color:var(--ink3); font-size:14.5px; line-height:1.5; max-width:380px; margin:6px auto 0}
  .bustline{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
            margin:18px auto 2px; font-family:var(--ff-mono); font-size:12.5px; color:var(--ink2)}
  .bustline .mini{width:34px; height:34px; border-radius:50%; overflow:hidden; background:var(--paper3);
                  flex-shrink:0; display:inline-block; vertical-align:middle}
  .bustline .mini img{width:100%; height:100%; object-fit:cover; object-position:center top}
  .bustline b{font-family:var(--ff-sans); font-size:14px}
  .stats{display:flex; justify-content:center; gap:34px; margin:22px 0 4px}
  .stats .n{font-family:var(--ff-serif); font-size:27px; color:var(--ink)}
  .stats .l{font-family:var(--ff-mono); font-size:9.5px; color:var(--ink3);
            text-transform:uppercase; letter-spacing:.11em; margin-top:2px}
  .grid-emoji{font-size:19px; letter-spacing:3px; margin:16px 0 2px; line-height:1.5}
  .btn{
    display:block; width:100%; max-width:340px; margin:12px auto 0; padding:14px;
    border:1.5px solid var(--orange); border-radius:9px; font-family:var(--ff-sans);
    font-size:15px; font-weight:600; cursor:pointer; background:var(--orange); color:#fff;
    transition:opacity .15s, background .15s;
  }
  .btn:hover{opacity:.92}
  .btn.ghost{background:transparent; color:var(--ink2); border-color:var(--rule)}
  .btn.ghost:hover{background:var(--paper2); opacity:1}
  .xpcard{margin:18px auto 4px; max-width:300px; background:var(--orange-lt); border:1px solid #f6d8c8;
          border-radius:10px; padding:14px 16px; text-align:left}
  html.night-mode .xpcard{border-color:transparent}
  .xpcard .xptitle{font-family:var(--ff-mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase;
                   color:var(--orange); text-align:center; margin-bottom:10px}
  .xprow{display:flex; justify-content:space-between; align-items:baseline;
         font-size:14px; color:var(--ink2); padding:3px 0}
  .xprow span:last-child{font-family:var(--ff-mono); color:var(--orange); font-weight:500}
  .xprow.xptotal{margin-top:6px; padding-top:9px; border-top:1px solid #f1cdb9; font-weight:600; color:var(--ink)}
  .xprow.xptotal span:last-child{font-size:16px}

  /* leaderboard */
  .lb-section{margin-top:22px; padding-top:16px; border-top:1px solid var(--rule); text-align:left}
  .lb-title{font-family:var(--ff-mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
            color:var(--ink3); margin-bottom:10px; text-align:center}
  .lb-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--paper3)}
  .lb-row:last-child{border-bottom:none}
  .lb-row.lb-you{background:var(--paper3); border-radius:8px; padding:8px; margin:2px 0}
  .lb-rank{font-family:var(--ff-mono); font-size:12px; color:var(--ink3); width:20px; text-align:right; flex-shrink:0}
  .lb-avatar{width:26px; height:26px; border-radius:50%; object-fit:cover; border:1.5px solid var(--rule); flex-shrink:0}
  .lb-avatar-initial{display:flex; align-items:center; justify-content:center; background:var(--paper2);
                     font-size:11px; color:var(--ink3)}
  .lb-name{flex:1; font-size:13px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lb-score{font-family:var(--ff-mono); font-size:12px; color:var(--ink2); flex-shrink:0}
  .lb-sep{text-align:center; color:var(--ink4); font-size:12px; padding:2px 0}
  .lb-toggle{display:block; width:100%; text-align:center; margin-top:10px; background:none; border:none;
             font-family:var(--ff-mono); font-size:11px; color:var(--orange); cursor:pointer; text-decoration:underline}
  .lb-loading{text-align:center; font-family:var(--ff-mono); font-size:11px; color:var(--ink4); padding:10px 0}

  .foot{margin-top:18px; text-align:center; font-family:var(--ff-mono);
        font-size:10.5px; letter-spacing:.06em; color:var(--ink4); line-height:1.8}
</style>
</head>
<body>
<header class="site-nav">
  <div class="site-nav__bar">
    <a class="site-nav__brand" href="/">
      <img src="/transparent.png" alt="">
      <span class="site-nav__word">ydk<span>ball</span></span>
    </a>
    <div class="site-nav__links" role="navigation" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/reviews">Reviews</a>
      <a href="/games">Games</a>
      <a href="/stats">Stats</a>
    </div>
    <div class="site-nav__auth" id="nav-auth-slot"></div>
  </div>
</header>

<div class="wrap">
  <div class="hud">
    <div class="hud-board">
      <div class="hud-kicker" id="hud-kicker">Higher or Lower</div>
      <div class="hud-label" id="hud-label">&nbsp;</div>
    </div>
    <div class="hud-right" id="hud-right"></div>
  </div>
  <div class="pips" id="pips"></div>
  <div id="stage" class="arena"></div>
  <div class="foot" id="foot"></div>
</div>

<script src="/team-colors.js"></script>
<script>
const API = window.location.protocol === 'file:' ? 'http://localhost:5000' : '';
const $ = s => document.querySelector(s);
const stage = $('#stage'), pipsEl = $('#pips'), footEl = $('#foot');
const hudLabel = $('#hud-label'), hudKicker = $('#hud-kicker'), hudRight = $('#hud-right');

const sleep = ms => new Promise(r => setTimeout(r, ms));
function jfetch(url, opts){
  return fetch(API+url, Object.assign({credentials:'include'}, opts||{}))
    .then(r => r.json().then(j => ({ok:r.ok, status:r.status, body:j})).catch(() => ({ok:false,status:r.status,body:{}})));
}
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ── state ────────────────────────────────────────────────────────────────────
// A run is one board and a chain of players. `round` is 1-based: the anchor is
// chain[round-1] and the challenger is chain[round]. Sudden death — `picks` only
// ever holds correct calls, so score === picks.length while you're alive.
let S = null;

const headshot = (id, big) =>
  `https://cdn.nba.com/headshots/nba/latest/${big ? '1040x760' : '260x190'}/${id}.png`;

// Career totals are whole numbers; everything else is a per-game average.
const isTotal = () => S && S.board && S.board.startsWith('career');
// Caption under a player's number: the unit plus WHEN it happened. On a career-best
// board each player's season differs, which is the most useful thing on the card.
function contextFor(link){
  const u = S.unit || '';
  if (isTotal()) return `${u} · all-time`;
  return link.season ? `${u} · ${link.season}` : u;
}
const fmtVal  = v => isTotal() ? Math.round(v).toLocaleString() : v.toFixed(1);

// The panel is built from the team's PRIMARY only, shaded into a darker version of
// itself. Using the official secondary breaks constantly — half the league's is pure
// black or white, which either kills the colour or blows out the type.
function shade(hex, f){
  const n = parseInt(String(hex).replace('#',''), 16);
  if (isNaN(n)) return '#15151b';
  const r = Math.round(((n >> 16) & 255) * f),
        g = Math.round(((n >> 8) & 255) * f),
        b = Math.round((n & 255) * f);
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}
function lum(hex){                       // perceived brightness, 0–255
  const n = parseInt(String(hex).replace('#',''), 16);
  if (isNaN(n)) return 0;
  return 0.2126*((n>>16)&255) + 0.7152*((n>>8)&255) + 0.0722*(n&255);
}
function teamVars(abbr){
  // team-colors.js declares `const TEAM_COLORS` — a top-level const is script-scoped
  // and never becomes a window property, so this must read the bare identifier.
  const map = (typeof TEAM_COLORS !== 'undefined') ? TEAM_COLORS : {};
  const c = map[abbr] || {};
  const p = c.primary || '#2f2f3a';
  // A bright primary (Indiana gold, Phoenix orange) blows out the panel: white
  // button labels and the ask line stop reading against it. Damp the wash and flip
  // the chip to dark ink instead of letting the brand colour win over legibility.
  const bright = lum(p) > 150;
  const glow = bright ? shade(p, 0.52) : p;
  return `--c1:${glow}; --c2:${shade(glow, 0.42)}; --chip:${p}; `
       + `--chip-ink:${bright ? '#12121a' : '#fff'}`;
}

// ── chrome ───────────────────────────────────────────────────────────────────
function renderHud(){
  hudLabel.innerHTML = `${esc(S.label || '')}` +
    (S.scope ? `<span class="scope">${esc(S.scope)}</span>` : '');
  hudKicker.textContent = S.mode === 'run' ? 'Unlimited run' : 'Higher or Lower';
  const streakBit = (S.mode === 'daily' && S.streak != null)
    ? `<div class="hud-stat"><div class="hud-n">${S.streak}</div><div class="hud-l">days</div></div>` : '';
  hudRight.innerHTML = `${streakBit}
    <div class="hud-stat"><div class="hud-n ${S.score > 0 ? 'hot' : ''}" id="hud-score">${S.score}</div>
      <div class="hud-l">streak</div></div>`;
}
function renderPips(){
  // The daily is a fixed 10-round chain, so its bar has a visible end to run out of.
  // An unlimited run has no round limit — giving it ten empty slots would invent a
  // target it doesn't have, so its bar just grows a segment per round survived.
  let h = '';
  if (S.mode === 'daily'){
    for (let i = 1; i <= S.rounds; i++){
      const cls = i <= S.score ? 'won' : (i === S.round && !S.over ? 'now' : (S.bustedRound === i ? 'lost' : ''));
      h += `<div class="pip ${cls}"></div>`;
    }
  } else {
    for (let i = 0; i < S.score; i++) h += `<div class="pip won"></div>`;
    if (S.bustedRound)  h += `<div class="pip lost"></div>`;
    else if (!S.over)   h += `<div class="pip now"></div>`;
  }
  pipsEl.innerHTML = h;
}
function setFoot(){
  footEl.innerHTML = S.mode === 'daily'
    ? `sudden death · one miss ends the day · same chain for everyone`
    : `sudden death · no round limit · go as deep as you can`;
}

// ── the arena ────────────────────────────────────────────────────────────────
function panelHTML(link, role){
  const revealed = role === 'anchor';
  return `
    <div class="panel ${role}" id="p-${role}" style="${teamVars(link.team)}">
      <img class="shot" src="${headshot(link.id, true)}" alt=""
           onerror="this.onerror=null;this.src='${headshot(link.id,false)}'">
      <div class="pbody">
        <div class="pteam">${esc(link.team || 'NBA')}</div>
        <div class="pname">${esc(link.name)}</div>
        ${revealed ? `
          <div class="pval">${esc(link.display)}</div>
          <div class="punit">${esc(contextFor(link))}</div>
        ` : `
          <div class="pval hidden-val" id="chal-val">?</div>
          <div class="punit">${esc(contextFor(link))}</div>
          <div class="pask">higher or lower than
            <b>${esc(S.chain[S.round-1].display)}</b>?</div>
          <div class="calls" id="calls">
            <button class="call" data-call="more"><span class="arrow">&#9650;</span> HIGHER</button>
            <button class="call" data-call="less"><span class="arrow">&#9660;</span> LOWER</button>
          </div>
        `}
      </div>
      ${revealed ? '' : `<div class="verdict" id="verdict"></div>`}
    </div>`;
}

function renderRound(){
  const anchor = S.chain[S.round - 1], chal = S.chain[S.round];
  stage.className = 'arena';
  stage.innerHTML = panelHTML(anchor, 'anchor')
    + `<div class="seam"><div class="seam-rule"></div>
         <div class="seam-badge">vs</div>
         <div class="seam-rule"></div></div>`
    + panelHTML(chal, 'challenger');
  renderHud(); renderPips(); setFoot();
  $('#calls').querySelectorAll('.call').forEach(b => {
    b.onclick = () => onCall(b.dataset.call, b);
  });
}

// Count the hidden number up from zero — the moment it passes (or fails to pass)
// the anchor's number is the whole beat of the game.
function countUp(el, to, dur = 900){
  return new Promise(res => {
    let t0 = null, done = false;
    const finish = () => { if (done) return; done = true; el.textContent = fmtVal(to); res(); };
    // A backgrounded tab throttles rAF to zero, and the whole turn is awaiting this
    // promise — without a timer fallback, switching apps mid-answer strands the
    // player on a board that never advances. Whichever lands first wins.
    const bail = setTimeout(finish, dur + 400);
    requestAnimationFrame(function tick(now){
      if (done) return;
      if (t0 === null) t0 = now;          // start from the first frame's own clock
      // Clamp BOTH ends: an elapsed time below zero sends the ease-out cubic
      // negative, which renders the hidden stat as "-0.3" before it counts up.
      const p = Math.max(0, Math.min(1, (now - t0) / dur));
      el.textContent = fmtVal(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) { requestAnimationFrame(tick); }
      else { clearTimeout(bail); finish(); }
    });
  });
}

async function onCall(call, btn){
  if (S.busy || S.over) return;
  S.busy = true;
  const anchor = S.chain[S.round - 1], chal = S.chain[S.round];
  const truth = chal.value > anchor.value ? 'more' : 'less';
  const right = call === truth;

  document.querySelectorAll('.call').forEach(b => b.disabled = true);
  btn.classList.add('chosen');

  const valEl = $('#chal-val');
  valEl.classList.remove('hidden-val');
  await countUp(valEl, chal.value);
  valEl.textContent = chal.display;
  valEl.classList.add(right ? 'good' : 'bad');

  const v = $('#verdict');
  v.className = 'verdict show ' + (right ? 'good' : 'bad');
  v.textContent = right ? 'correct' : 'wrong';

  if (right){
    S.picks.push(call); S.score = S.picks.length;
    $('#hud-score').textContent = S.score;
    $('#hud-score').classList.add('hot');
    if (S.mode === 'daily') saveProgress();
    await sleep(620);
    await advance();
  } else {
    S.bustedRound = S.round;
    await sleep(1150);
    finish(call);
  }
  S.busy = false;
}

// The revealed card slides into the anchor slot and the spent anchor leaves —
// the motion *is* the mechanic, so it animates rather than cutting.
async function advance(){
  const a = $('#p-anchor'), c = $('#p-challenger');
  const ar = a.getBoundingClientRect(), cr = c.getBoundingClientRect();
  const dx = ar.left - cr.left, dy = ar.top - cr.top;
  a.style.transition = 'transform .46s cubic-bezier(.45,0,.2,1), opacity .36s ease';
  a.style.transform  = `translate(${-dx}px, ${-dy}px) scale(.96)`;
  a.style.opacity    = '0';
  c.style.transition = 'transform .46s cubic-bezier(.45,0,.2,1)';
  c.style.transform  = `translate(${dx}px, ${dy}px)`;
  await sleep(470);

  S.round++;
  if (S.round < S.chain.length) return renderRound();

  // Only an unlimited run extends past the pre-built chain. The daily stays a fixed
  // 10 for everyone: the server caps its score at `rounds`, so letting Pro play on
  // would climb a visible streak past a number that can never be recorded — and it
  // would stop being the same chain everyone else is compared against.
  if (S.mode === 'run'){
    const more = await extend();
    if (more) return renderRound();
  }
  finish(null);
}

async function extend(){
  const anchor = S.chain[S.round - 1];
  const used = S.chain.map(l => l.id).join(',');
  const r = await jfetch(`/api/survival/chain/next?board=${encodeURIComponent(S.board)}`
    + `&anchor=${anchor.id}&exclude=${used}&round=${S.round}`);
  if (r.ok && r.body.link){ S.chain.push(r.body.link); return true; }
  return false;
}

function saveProgress(){
  jfetch('/api/survival/chain/daily/progress', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({picks: S.picks})
  }).catch(() => {});   // a failed save just means no resume, never a blocked answer
}

// ── share ────────────────────────────────────────────────────────────────────
function shareGrid(){
  const won = '\u{1F3C0}'.repeat(S.score);
  return S.mode === 'daily'
    ? won + (S.bustedRound ? '❌' : '') + '⬜'.repeat(Math.max(0, S.rounds - S.score - (S.bustedRound ? 1 : 0)))
    : won + (S.bustedRound ? '❌' : '');
}
function shareText(){
  const head = S.mode === 'daily'
    ? `ydkball Higher or Lower — ${S.score}/${S.rounds}`
    : `ydkball Higher or Lower · Unlimited — ${S.score} deep`;
  return `${head}\n${S.label}\n${shareGrid()}\nydkball.net/survival`;
}
async function doShare(btn){
  const text = shareText();
  // The rendered card is the thing that actually travels; text is the fallback.
  try {
    const url = `/api/survival/chain/share.png?date=${encodeURIComponent(S.date||'')}`
              + `&score=${S.score}&mode=${S.mode}&label=${encodeURIComponent(S.label||'')}`;
    const res = await fetch(API + url, {credentials:'include'});
    if (res.ok && navigator.canShare){
      const file = new File([await res.blob()], 'ydkball-higher-or-lower.png', {type:'image/png'});
      if (navigator.canShare({files:[file]})){
        await navigator.share({files:[file], text});
        return;
      }
    }
  } catch(e){ /* fall through to text */ }
  if (navigator.share){ try { await navigator.share({text}); return; } catch(e){ return; } }
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied!'; } catch(e){}
}

// ── end of run ───────────────────────────────────────────────────────────────
function headlineFor(){
  // `S.perfect` is the server's call once a daily is submitted; before that (and for
  // Pro runs, which aren't scored server-side) fall back to "never busted".
  const perfect = S.perfect != null ? S.perfect : (!S.bustedRound && S.score >= S.rounds);
  if (S.mode === 'run'){
    return S.score >= 15 ? {t:'Absurd.', c:'win', logo:true}
         : S.score >= 8  ? {t:'You know ball.', c:'win', logo:true}
         : {t:'Run over.', c:'', logo:false};
  }
  if (perfect)          return {t:'You KNOW ball.', c:'win', logo:true};
  if (S.score >= 7)     return {t:'You know ball.', c:'win', logo:true};
  if (S.score >= 4)     return {t:'Solid run.', c:'', logo:false};
  return {t:'Hit the film room.', c:'', logo:false};
}

async function finish(call){
  S.over = true;
  renderPips();
  let xp = null;
  if (S.mode === 'daily'){
    const res = await jfetch('/api/survival/chain/daily/result', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({picks: S.picks})
    });
    if (res.ok){
      S.score = res.body.recorded; S.best = res.body.best; S.streak = res.body.streak;
      xp = res.body.xp_breakdown; S.xpGained = res.body.xp_gained;
      S.perfect = res.body.perfect;
      if (res.body.busted_round) S.bustedRound = res.body.busted_round;
    }
    try { localStorage.setItem('hol_chain_' + S.date,
          JSON.stringify({score:S.score, busted:S.bustedRound})); } catch(e){}
  } else {
    S.best = Math.max(S.best || 0, S.score);
    try { localStorage.setItem('hol_run_best', S.best); } catch(e){}
  }
  renderResult({xp, bustCall: call});
}

function bustLineHTML(call){
  if (!S.bustedRound) return '';
  const a = S.chain[S.bustedRound - 1], c = S.chain[S.bustedRound];
  const said = call === 'more' ? 'higher' : 'lower';
  return `<div class="bustline">
      <span class="mini"><img src="${headshot(c.id,false)}" onerror="this.remove()" alt=""></span>
      <span>you said <b>${said}</b> &mdash; ${esc(c.name)} had
        <b>${esc(c.display)}</b> to ${esc(a.name.split(' ').slice(-1)[0])}'s <b>${esc(a.display)}</b></span>
    </div>`;
}

function renderResult({xp, bustCall}){
  const h = headlineFor();
  const big = S.mode === 'daily'
    ? `${S.score}<small>/${S.rounds}</small>` : `${S.score}`;
  const sub = S.mode === 'daily'
    ? (S.bustedRound ? `You got ${S.score} ${S.score===1?'round':'rounds'} deep. New chain tomorrow.`
                     : `You ran the whole chain. New one tomorrow.`)
    : `${S.score} ${S.score===1?'round':'rounds'} deep on ${S.label.toLowerCase()}.`;
  const xpHTML = xp ? `<div class="xpcard">
      <div class="xptitle">Ball Knowledge earned</div>
      <div class="xprow"><span>Played today</span><span>+${xp.play}</span></div>
      <div class="xprow"><span>${xp.rounds} rounds &times; ${xp.per_round}</span><span>+${xp.rounds_xp}</span></div>
      <div class="xprow xptotal"><span>Total</span><span>+${xp.total}</span></div>
    </div>` : '';
  const statsHTML = S.mode === 'daily'
    ? `<div><div class="n">${S.streak ?? 0}</div><div class="l">day streak</div></div>
       <div><div class="n">${S.best ?? S.score}</div><div class="l">best</div></div>`
    : `<div><div class="n">${S.best ?? S.score}</div><div class="l">best run</div></div>`;
  const again = S.isPro
    ? `<button class="btn ghost" id="again">New run</button>`
    : `<a class="btn ghost" href="/games" style="text-decoration:none">Back to games</a>`;

  stage.className = '';
  stage.innerHTML = `<div class="card">
      ${h.logo ? `<img class="resultlogo" src="/transparent.png" alt="">` : ''}
      <div class="headline ${h.c}">${h.t}</div>
      <div class="big">${big}</div>
      <div class="sub">${esc(sub)}</div>
      ${bustLineHTML(bustCall)}
      <div class="grid-emoji">${shareGrid()}</div>
      ${xpHTML}
      <div class="stats">${statsHTML}</div>
      <button class="btn" id="share">Share result</button>
      ${again}
      ${S.mode === 'daily' && !S.isPro
        ? `<div class="sub" style="margin-top:14px">Pro plays unlimited runs with no round limit.</div>` : ''}
      ${S.mode === 'daily' ? `<div id="lb-wrap"></div>` : ''}
    </div>`;
  $('#share').onclick = e => doShare(e.currentTarget);
  if ($('#again')) $('#again').onclick = startRun;
  if (S.mode === 'daily') loadLeaderboard();
}

// ── leaderboard ──────────────────────────────────────────────────────────────
async function loadLeaderboard(){
  const wrap = $('#lb-wrap'); if (!wrap) return;
  wrap.innerHTML = `<div class="lb-loading">Loading today's leaderboard…</div>`;
  const res = await jfetch('/api/survival/chain/leaderboard');
  if (!res.ok) { wrap.innerHTML = ''; return; }
  drawLb(wrap, res.body, false);
}
function drawLb(wrap, data, full){
  const shown = full ? data.entries : data.entries.slice(0, 5);
  const rows = shown.map(lbRow).join('');
  const youRow = (!full && data.you && !shown.some(e => e.is_you))
    ? `<div class="lb-sep">···</div>${lbRow(data.you)}` : '';
  const toggle = (!full && data.total_players > shown.length)
    ? `<button class="lb-toggle" id="lb-toggle">See full leaderboard (${data.total_players})</button>` : '';
  wrap.innerHTML = `<div class="lb-section">
      <div class="lb-title">Today's Leaderboard</div>${rows}${youRow}${toggle}</div>`;
  if (toggle) $('#lb-toggle').onclick = () => drawLb(wrap, data, true);
}
function lbRow(e){
  const initial = e.display_name ? e.display_name.charAt(0).toUpperCase() : '?';
  const avatar = e.avatar_url
    ? `<img class="lb-avatar" src="${esc(e.avatar_url)}" alt="">`
    : `<div class="lb-avatar lb-avatar-initial">${esc(initial)}</div>`;
  return `<div class="lb-row ${e.is_you ? 'lb-you' : ''}">
      <div class="lb-rank">${e.rank}</div>${avatar}
      <div class="lb-name">${esc(e.display_name)}${e.is_you ? ' (you)' : ''}</div>
      <div class="lb-score">${e.score}/${S.rounds}</div></div>`;
}

// ── cards ────────────────────────────────────────────────────────────────────
function simpleCard(inner){ stage.className = ''; stage.innerHTML = `<div class="card">${inner}</div>`; }

function renderAlreadyPlayed(d){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('hol_chain_' + d.date) || 'null'); } catch(e){}
  S.score = d.your_result;
  S.bustedRound = saved && saved.busted ? saved.busted
                : (d.your_result < S.rounds ? d.your_result + 1 : null);
  S.perfect = d.your_result >= S.rounds;
  S.over = true;
  renderHud(); renderPips(); setFoot();
  const h = headlineFor();
  stage.className = '';
  stage.innerHTML = `<div class="card">
      ${h.logo ? `<img class="resultlogo" src="/transparent.png" alt="">` : ''}
      <div class="headline ${h.c}">${h.t}</div>
      <div class="big">${S.score}<small>/${S.rounds}</small></div>
      <div class="sub">You've already run today's chain — a new one lands tomorrow.</div>
      <div class="grid-emoji">${shareGrid()}</div>
      <div class="stats">
        <div><div class="n">${d.streak ?? 0}</div><div class="l">day streak</div></div>
        <div><div class="n">${d.best ?? S.score}</div><div class="l">best</div></div>
      </div>
      <button class="btn" id="share">Share result</button>
      ${S.isPro ? `<button class="btn ghost" id="again">New run</button>`
                : `<a class="btn ghost" href="/games" style="text-decoration:none">Back to games</a>`}
      <div id="lb-wrap"></div>
    </div>`;
  $('#share').onclick = e => doShare(e.currentTarget);
  if ($('#again')) $('#again').onclick = startRun;
  loadLeaderboard();
}

// ── boot ─────────────────────────────────────────────────────────────────────
function newState(src, mode){
  return {
    mode, date: src.date || '', board: src.board, label: src.label,
    noun: src.noun, unit: src.unit, scope: src.scope || '', rounds: src.rounds, chain: src.chain,
    round: 1, picks: [], score: 0, over: false, busy: false, bustedRound: null,
    best: src.best ?? 0, streak: src.streak ?? null, isPro: !!src.is_pro,
  };
}

async function startRun(){
  const prevPro = S ? S.isPro : true;   // cold deep-link: let the 403 do the gating
  const prevBest = +(localStorage.getItem('hol_run_best') || 0);
  stage.className = '';
  stage.innerHTML = `<div class="card"><div class="sub">Dealing a new chain…</div></div>`;
  const r = await jfetch('/api/survival/chain/run');
  if (r.status === 403) return simpleCard(`
      <img class="resultlogo" src="/transparent.png" alt="">
      <div class="headline">Unlimited is Pro</div>
      <div class="sub">Unlimited runs with no round limit are a ydkball Pro feature.<br>
        Today's chain is always free.</div>
      <a class="btn ghost" href="/games" style="text-decoration:none">Back to games</a>`);
  if (!r.ok) return simpleCard(`<div class="sub">Couldn't deal a new chain. Try again.</div>`);
  S = newState(r.body, 'run');
  S.isPro = prevPro; S.best = prevBest;
  renderRound();
}

async function boot(){
  // The games hub deep-links straight into a Pro run.
  if (new URLSearchParams(location.search).get('mode') === 'unlimited') return startRun();
  const d = await jfetch('/api/survival/chain/daily');
  if (d.status === 401){
    S = {mode:'daily', rounds:10, score:0, chain:[], label:''};
    return simpleCard(`
      <img class="resultlogo" src="/transparent.png" alt="">
      <div class="headline">Sign in to play</div>
      <div class="sub">Higher or Lower is free with a ydkball account — your daily chain,
        streak and Ball Knowledge are saved to it.</div>
      <a class="btn" href="/auth/google/login?next=${encodeURIComponent('/survival')}"
         style="text-decoration:none">Sign in</a>`);
  }
  if (!d.ok){
    S = {mode:'daily', rounds:10, score:0, chain:[], label:''};
    return simpleCard(`<div class="sub">${esc(d.body.message || "Couldn't load today's chain.")}</div>`);
  }
  S = newState(d.body, 'daily');

  if (d.body.your_result != null) return renderAlreadyPlayed(d.body);

  // Resume an unfinished run — quitting mid-chain can't be used to reroll a bad start.
  const saved = (d.body.progress || []).filter(p => p === 'more' || p === 'less');
  if (saved.length){
    S.picks = saved.slice(0, S.rounds);
    S.score = S.picks.length;
    S.round = S.score + 1;
    if (S.round >= S.chain.length) return finish(null);   // finished but never submitted
  }
  renderRound();
}

boot().catch(e => {
  S = S || {mode:'daily', rounds:10, score:0, chain:[], label:''};
  simpleCard(`<div class="sub">Couldn't load today's chain.<br>${esc(e)}</div>`);
});
</script>
<script src="/site-nav.js"></script>
</body>
