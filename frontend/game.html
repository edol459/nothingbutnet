    _reviewOffset = 0;
    _currentTags  = [];
    _attended     = false;
    _potgPick     = null;
    _potgTally    = null;
    closeTagPicker();
    if (container) container.innerHTML = '<div class="reviews-loading">Loading…</div>';
    _panelsLoaded = true;
  }

  const [gameRes, revRes, potgRes] = await Promise.all([
    fetch(`/api/games/${GAME_ID}`),
    fetch(`/api/games/${GAME_ID}/reviews?logs=1&limit=15&offset=${_reviewOffset}&sort=${_reviewSort}`),
    fetch(`/api/games/${GAME_ID}/potg`),
  ]);

  const gameData = gameRes.ok ? await gameRes.json() : {};
  const revData  = revRes.ok  ? await revRes.json()  : {};
  _potgTally     = potgRes.ok ? await potgRes.json() : null;

  // Seed the pick from the TALLY, not the box score: the tally already carries the
  // name and team, so this still works if the box score failed to load. Getting this
  // wrong would be silent and destructive — an unseeded pick submits as `potg: null`,
  // which now means "clear it".
  const _mine = _potgTally && _potgTally.my_pick;
  if (_mine) {
    const row = (_potgTally.results || []).find(r => r.person_id === _mine) || {};
    _potgPick = { person_id: _mine, player_name: row.player_name || '', team_abbr: row.team_abbr || null };
  }
  const g        = gameData.game || {};
  const reviews  = revData.reviews || [];
  _reviewTotal   = revData.total || 0;
  _reviewOffset  += reviews.length;

  if (!append) {
    const logHost = logPanel && logPanel.querySelector('.log-panel');
    if (logHost) { logHost.innerHTML = renderLogContent(g); buildStarPicker(); wireWriteSection(); }
    if (container) container.innerHTML = renderCommunityContent(g, reviews, revData.has_more);
    wireCommunitySection();
  } else {
    // Append new reviews before load-more button
    const list = container.querySelector('.review-list');
    const btn  = container.querySelector('.btn-load-more');
    if (list) reviews.forEach(r => list.insertAdjacentHTML('beforeend', reviewItemHTML(r)));
    if (btn) {
      if (revData.has_more) {
        btn.textContent = `Load more (${_reviewTotal - _reviewOffset} remaining)`;
      } else {
        btn.remove();
      }
    }
  }
}

// ── The log sheet ─────────────────────────────────────────
// Deliberately carries NO tally and none of other people's logs. Seeing "Haliburton
// 62%" while you are choosing your own Player of the Game corrupts the pick, so the
// crowd lives one tab over — the same separation the app enforces.
//
// Field order matches the app: pick → stars → note. Every field stands alone; a
// rating, a pick or a note is each a complete log on its own.
function renderLogContent(g) {
  if (!_reviewUser) {
    return `<div class="reviews-write">
      <p class="review-signin-prompt">
        <a href="${reviewSignInHref()}">Sign in</a> to log this game.
      </p></div>`;
  }
  // Final games only — a pick made at halftime is a different claim from one made at
  // the buzzer, and mixing them corrupts the tally.
  //
  // Rendered always and merely HIDDEN until the buzzer, rather than rendered on demand:
  // a game can go final while the sheet is open, and re-rendering the sheet to add the
  // picker would take the note being typed with it.
  const potgHtml =
    `<div id="potg-block" style="display:${_gameStatus === 3 ? '' : 'none'}">
       <div class="reviews-write-title">Player of the Game</div>
       <select class="potg-select" id="potg-select"><option value="">— No pick —</option></select>
     </div>`;
  return `<div class="reviews-write" id="reviews-write-section">
      ${potgHtml}
      <div class="reviews-write-title" id="write-title">Rate This Game</div>
      <div class="star-picker-inline" id="star-picker-inline"></div>
      <!-- Attendance was a bare person icon appended to the stat-tag row, with the
           meaning carried only by a title tooltip. 15 people have ever marked it. It
           is also the seed of the ticketbook, so it gets a label and a row. -->
      <button class="attended-row" id="btn-attended" type="button" aria-pressed="false">
        <span class="attended-box" aria-hidden="true"></span>
        <span class="attended-text">I was at this game</span>
      </button>
      <div class="note-head">
        <span class="reviews-write-title">Your Notes</span>
        <button class="btn-stamp" id="btn-stamp" type="button" title="Insert the game clock (Alt+S)">⏱ <span id="btn-stamp-label">Stamp</span></button>
      </div>
      <textarea class="review-write-textarea" id="review-textarea" placeholder="Write about this game…"${_reviewUser.is_pro ? '' : ` maxlength="${FREE_REVIEW_LIMIT}"`}></textarea>
      ${_reviewUser.is_pro ? '' : `<div class="review-charcount" id="review-charcount">0/${FREE_REVIEW_LIMIT}</div>`}
      <div class="write-tags-row" id="write-tags-row"></div>
      <div class="reviews-write-actions">
        <button class="btn-watch${g.is_watched ? ' on' : ''}" id="btn-watch" type="button">${_EYE_SVG}<span id="btn-watch-label">${g.is_watched ? 'Watched' : 'Mark watched'}</span></button>
        <span class="draft-state" id="draft-state"></span>
        <button class="btn-review-submit" id="btn-review-submit">Submit</button>
      </div>
    </div>`;
}

// ── The community tab ─────────────────────────────────────
function renderCommunityContent(g, reviews, hasMore) {
  let aggHtml;
  if (g.review_count > 0) {
    const stars = (g.avg_stars || 0).toFixed(2);
    aggHtml = `
      <div class="reviews-agg">
        <span class="reviews-agg-val">${stars}</span>
        <span class="reviews-agg-stars">${starsText(g.avg_stars * 2, 16)}</span>
        <span class="reviews-agg-count">${g.review_count} rating${g.review_count !== 1 ? 's' : ''}</span>
      </div>`;
  } else {
    aggHtml = `<div class="reviews-agg"><span class="reviews-agg-empty">No ratings yet — be the first.</span></div>`;
  }

  const sortHtml = reviews.length > 0 ? `
    <div class="reviews-sort">
      <button class="reviews-sort-btn${_reviewSort === 'likes' ? ' active' : ''}" data-sort="likes">Most Liked</button>
      <button class="reviews-sort-btn${_reviewSort === 'date'  ? ' active' : ''}" data-sort="date">Most Recent</button>
    </div>` : '';
  const listHtml = reviews.length === 0
    ? '<div class="reviews-empty">No logs yet.</div>'
    : `${sortHtml}<div class="review-list">${reviews.map(reviewItemHTML).join('')}</div>`;

  const loadMoreHtml = hasMore
    ? `<button class="btn-load-more">Load more (${_reviewTotal - _reviewOffset} remaining)</button>`
    : '';

  return `
    <div class="reviews-header">
      ${aggHtml}
      ${potgTallyHTML(_potgTally)}
    </div>
    ${listHtml}
    ${loadMoreHtml}
  `;
}

// A native <select> rather than a custom dropdown: the roster is already loaded, and
// this gets keyboard, screen-reader and mobile-wheel behaviour for free.
function renderPotgSelect() {
  const sel = document.getElementById('potg-select');
  if (!sel) return;
  const b = _boxscoreData || {};
  let html = '<option value="">— No pick —</option>';
  [b.awayTeam, b.homeTeam].filter(Boolean).forEach(t => {
    const abbr = t.teamTricode || '';
    const ps = (t.players || [])
      .filter(p => p.personId)
      .sort((a, c) => (c.statistics?.points || 0) - (a.statistics?.points || 0));
    if (!ps.length) return;
    html += `<optgroup label="${_pcEsc(abbr)}">` + ps.map(p => {
      const pts = p.statistics?.points;
      const label = _pcEsc(p.name || '') + (pts != null ? ` — ${pts} PTS` : '');
      const on = _potgPick && String(_potgPick.person_id) === String(p.personId);
      return `<option value="${p.personId}"${on ? ' selected' : ''}>${label}</option>`;
    }).join('') + '</optgroup>';
  });
  // Box score missing or the player absent from it: carry the existing pick anyway,
  // or the select would silently read as "no pick" and the next submit would erase it.
  if (_potgPick && !html.includes(`value="${_potgPick.person_id}"`)) {
    html += `<option value="${_potgPick.person_id}" selected>${_pcEsc(_potgPick.player_name || 'Your pick')}</option>`;
  }
  sel.innerHTML = html;
}

function _potgLookup(personId) {
  const b = _boxscoreData || {};
  for (const t of [b.awayTeam, b.homeTeam].filter(Boolean)) {
    const hit = (t.players || []).find(p => String(p.personId) === String(personId));
    if (hit) return { name: hit.name || '', abbr: t.teamTricode || '' };
  }
  return null;
}

function potgTallyHTML(t) {
  if (!t || !t.results || !t.results.length) return '';
  const rows = t.results.slice(0, 5).map(r => {
    const pct = Math.round((r.share || 0) * 100);
    return `<div class="potg-row">
      <span class="potg-row-name">${_pcEsc(r.player_name)}${r.team_abbr ? ` <span class="potg-row-team">${_pcEsc(r.team_abbr)}</span>` : ''}</span>
      <span class="potg-bar"><span style="width:${pct}%"></span></span>
      <span class="potg-votes">${r.votes}</span>
    </div>`;
  }).join('');
  return `<div class="potg-tally">
    <div class="potg-tally-title">PLAYER OF THE GAME · ${t.total_votes} PICK${t.total_votes === 1 ? '' : 'S'}</div>
    ${rows}
  </div>`;
}

function reviewItemHTML(r) {
  const heartIcon = `<svg viewBox="0 0 20 20" fill="${r.liked_by_me ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8">
    <path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"/>
  </svg>`;
  const likeLabel = r.like_count > 0 ? r.like_count : '';
  return `<div class="review-item" data-review-id="${r.id}">
    ${avatarEl(r.display_name, r.avatar_url, r.user_id, r.favorite_team)}
    <div class="review-body">
      <div class="review-top">
        <a href="/profile/${r.user_id}" class="review-name" onclick="event.stopPropagation()" style="text-decoration:none;color:inherit">${r.display_name}</a>
        ${r.rating ? starsText(r.rating) : ''}
        <span class="review-date">${fmtShortDate(r.created_at)}</span>
      </div>
      ${r.potg_name ? `<div class="review-potg">&#127942; ${_pcEsc(r.potg_name)}</div>` : ''}
      ${r.review_text ? `<p class="review-text">${r.review_text}</p>` : ''}
      ${(r.tags && r.tags.length) || r.attended ? `<div class="review-tags">
        ${r.attended ? `<span class="attended-badge">${_PERSON_SVG}attended</span>` : ''}
        ${r.tags ? r.tags.map(t => tagPillHTML(t)).join('') : ''}
      </div>` : ''}
      <div class="review-footer">
        <button class="btn-like${r.liked_by_me ? ' liked' : ''}" data-review-id="${r.id}" title="Like this review">
          ${heartIcon}<span class="like-count">${likeLabel}</span>
        </button>
        <button class="btn-reply" data-review-id="${r.id}" title="Reply">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M2 4h16v10H6l-4 4V4z"/>
          </svg>
          ${r.reply_count > 0 ? `<span>${r.reply_count}</span>` : ''}
        </button>
        <button class="btn-share" data-review-id="${r.id}" title="Copy screenshot">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="9" width="14" height="9" rx="1.5"/><path d="M10 1v10M7 4l3-3 3 3"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="reply-section" id="reply-section-${r.id}" data-review-id="${r.id}"></div>`;
}

function wireCommunitySection() {
  const panel = document.getElementById('panel-community');
  if (!panel) return;

  // Load-more
  const loadMoreBtn = panel.querySelector('.btn-load-more');
  if (loadMoreBtn) loadMoreBtn.addEventListener('click', () => loadGamePanels(true));

  // Sort toggle
  panel.querySelectorAll('.reviews-sort-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      _reviewSort = btn.dataset.sort;
      loadGamePanels(false);
    });
  });

  // Like + reply buttons — wire once, use event delegation so re-renders stay covered
  if (!_likesWired) {
    _likesWired = true;
    panel.addEventListener('click', async e => {
      // Like
      const likeBtn = e.target.closest('.btn-like');
      if (likeBtn) {
        if (!_reviewUser) {
          window.location.href = reviewSignInHref();
          return;
        }
        const reviewId = likeBtn.dataset.reviewId;
        const res = await fetch(`/api/reviews/${reviewId}/like`, { method: 'POST' });
        if (!res.ok) return;
        const data = await res.json();
        likeBtn.classList.toggle('liked', data.liked);
        const svg = likeBtn.querySelector('svg');
        if (svg) svg.setAttribute('fill', data.liked ? 'currentColor' : 'none');
        const countEl = likeBtn.querySelector('.like-count');
        if (countEl) countEl.textContent = data.like_count > 0 ? data.like_count : '';
        return;
      }
      // Toggle reply section
      const replyBtn = e.target.closest('.btn-reply');
      if (replyBtn) {
        toggleReplies(parseInt(replyBtn.dataset.reviewId));
        return;
      }
      // Share screenshot
      const shareBtn = e.target.closest('.btn-share');
      if (shareBtn) {
        const item = shareBtn.closest('.review-item');
        if (item) shareReviewItem(item, shareBtn);
        return;
      }
      // Show more replies
      const showMoreBtn = e.target.closest('.btn-show-more-replies');
      if (showMoreBtn) {
        loadMoreReplies(parseInt(showMoreBtn.dataset.reviewId));
        return;
      }
      // Delete reply
      const delBtn = e.target.closest('.btn-delete-reply');
      if (delBtn) {
        deleteReply(parseInt(delBtn.dataset.reviewId), parseInt(delBtn.dataset.replyId), delBtn.closest('.reply-item'));
        return;
      }
      // Send reply (Enter key is handled separately)
      const sendBtn = e.target.closest('.btn-send-reply');
      if (sendBtn) {
        const section = sendBtn.closest('.reply-section');
        submitReply(parseInt(section.dataset.reviewId), section.querySelector('.reply-input'));
        return;
      }
    });
    // Submit reply on Enter
    panel.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const input = e.target.closest('.reply-input');
      if (!input) return;
      e.preventDefault();
      const section = input.closest('.reply-section');
      submitReply(parseInt(section.dataset.reviewId), input);
    });
  }
}

function wireWriteSection() {
  if (!_reviewUser) return;

  // Initial empty tag row
  renderWriteTags();
  renderPotgSelect();
  const ta0 = document.getElementById('review-textarea');
  if (ta0) ta0.addEventListener('input', () => { updateCharCount(); queueDraftSave(); });
  updateCharCount();
  const potgSel = document.getElementById('potg-select');
  if (potgSel) potgSel.addEventListener('change', () => {
    const id = potgSel.value;
    if (!id) { _potgPick = null; queueDraftSave(); return; }
    const found = _potgLookup(id);
    _potgPick = { person_id: parseInt(id, 10),
                  player_name: found ? found.name : '',
                  team_abbr:   found ? found.abbr : null };
    queueDraftSave();
  });

  // Clock stamp — the reason to write on a laptop during the game. Alt+S so it works
  // without leaving the keyboard; the browser owns every Ctrl/Cmd combination worth
  // having here.
  const stampBtn = document.getElementById('btn-stamp');
  if (stampBtn) stampBtn.addEventListener('click', stampClock);
  if (ta0) ta0.addEventListener('keydown', e => {
    if (e.altKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); stampClock(); }
  });

  const attBtn = document.getElementById('btn-attended');
  if (attBtn) attBtn.addEventListener('click', () => {
    _attended = !_attended;
    renderAttended();
    queueDraftSave();
  });
  renderAttended();

  // Submit
  const submitBtn = document.getElementById('btn-review-submit');
  if (submitBtn) submitBtn.addEventListener('click', submitReview);

  // Watched toggle
  const watchBtn = document.getElementById('btn-watch');
  if (watchBtn) watchBtn.addEventListener('click', toggleWatch);

  seedSheet();
  syncGameState(GAME_DATA && GAME_DATA.box);
}

// Fill the sheet from the server: the published log first, then the draft on top.
//
// That order is deliberate. Publishing DELETES the draft server-side, so a draft that
// exists alongside a published log can only have been written after the publish — it
// is strictly the newer state of the user's editing and must win.
async function seedSheet() {
  // Only a finished game can have a published log, and /api/games/<id>/reviews is
  // useless before then, so skip the round trip entirely during a live game.
  if (_gameStatus === 3) {
    try {
      const data = await fetch(`/api/games/${GAME_ID}/reviews?logs=1&limit=100`).then(r => r.json());
      const mine = (data.reviews || []).find(r => r.user_id === _reviewUser.id);
      if (mine) {
        _isPublished = true;
        _pickedRating = mine.rating || 0;
        applyStarColors(_pickedRating);
        const ta = document.getElementById('review-textarea');
        if (ta) { ta.value = mine.review_text || ''; updateCharCount(); }
        const title = document.getElementById('write-title');
        if (title) title.textContent = 'Your Rating';
        if (mine.tags && mine.tags.length) _currentTags = mine.tags.slice();
        _attended = !!mine.attended;
        renderWriteTags(); renderAttended();
        addDeleteButton();
      }
    } catch {}
  }

  try {
    const { draft } = await fetch(`/api/games/${GAME_ID}/draft`).then(r => r.json());
    if (draft) {
      if (draft.rating) { _pickedRating = draft.rating; applyStarColors(_pickedRating); }
      const ta = document.getElementById('review-textarea');
      if (ta && draft.review_text) { ta.value = draft.review_text; updateCharCount(); }
      if (draft.tags && draft.tags.length) { _currentTags = draft.tags.slice(); renderWriteTags(); }
      if (draft.attended) { _attended = true; renderAttended(); }
      if (draft.potg) { _potgPick = draft.potg; renderPotgSelect(); }
      setDraftState('saved');
    }
  } catch {}
  syncGameState(GAME_DATA && GAME_DATA.box);
}

function renderAttended() {
  const btn = document.getElementById('btn-attended');
  if (!btn) return;
  btn.classList.toggle('on', _attended);
  btn.setAttribute('aria-pressed', _attended ? 'true' : 'false');
}

function addDeleteButton() {
  const btn = document.getElementById('btn-review-submit');
  if (!btn || document.querySelector('.btn-review-delete')) return;
  const del = document.createElement('button');
  del.className = 'btn-review-delete';
  del.textContent = 'Delete log';
  del.addEventListener('click', deleteReview);
  btn.parentElement.appendChild(del);
}

// ── Draft autosave ────────────────────────────────────────
// Debounced to 2s per the live-logging spec: a three-hour session touches this
// notebook constantly and does not need a round trip per keystroke.
function queueDraftSave() {
  _draftDirty = true;
  setDraftState('saving');
  if (_draftTimer) clearTimeout(_draftTimer);
  _draftTimer = setTimeout(flushDraft, 2000);
}

function draftBody() {
  return {
    rating:      _pickedRating || null,
    review_text: document.getElementById('review-textarea')?.value || null,
    tags:        _currentTags,
    attended:    _attended,
    potg:        _potgPick,
    league:      IS_WNBA ? 'wnba' : 'nba',
    home_abbr:   GAME_DATA?.box?.homeTeam?.teamTricode || null,
    away_abbr:   GAME_DATA?.box?.awayTeam?.teamTricode || null,
  };
}

async function flushDraft() {
  if (!_reviewUser || !_draftDirty || _draftInFlight) return;
  _draftInFlight = true; _draftDirty = false;
  try {
    const r = await fetch(`/api/games/${GAME_ID}/draft`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(draftBody()),
    });
    setDraftState(r.ok ? 'saved' : 'error');
  } catch { setDraftState('error'); }
  _draftInFlight = false;
  if (_draftDirty) flushDraft();   // an edit landed mid-request
}

function setDraftState(s) {
  const el = document.getElementById('draft-state');
  if (!el) return;
  el.className = 'draft-state ' + s;
  el.textContent = s === 'saving' ? 'Saving…'
                 : s === 'saved'  ? 'Draft saved'
                 : s === 'error'  ? 'Not saved — retrying'
                 : '';
}

// Closing the tab mid-sentence must not cost the note. keepalive lets the request
// outlive the page; a normal fetch here is cancelled on unload.
window.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && _draftDirty && _reviewUser) {
    if (_draftTimer) clearTimeout(_draftTimer);
    try {
      fetch(`/api/games/${GAME_ID}/draft`, {
        method: 'PUT', keepalive: true,
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(draftBody()),
      });
      _draftDirty = false;
    } catch {}
  }
});

// ── Clock stamp ───────────────────────────────────────────
function currentClockLabel() {
  const box = GAME_DATA && GAME_DATA.box;
  if (!box || !box.period) return null;
  const p = box.period;
  const label = p > 4 ? `OT${p - 4}` : `Q${p}`;
  const clock = fmtClock(box.gameClock || '');
  return clock ? `${label} ${clock}` : label;
}

function stampClock() {
  const ta = document.getElementById('review-textarea');
  const label = currentClockLabel();
  if (!ta || !label) return;
  const at     = ta.selectionStart ?? ta.value.length;
  const before = ta.value.slice(0, at);
  const after  = ta.value.slice(at);
  // Each stamp opens its own line, so the note reads as a timeline rather than a
  // paragraph with times buried in it.
  const lead = (before === '' || before.endsWith('\n')) ? '' : '\n';
  const ins  = `${lead}[${label}] `;
  ta.value = before + ins + after;
  const pos = (before + ins).length;
  ta.setSelectionRange(pos, pos);
  ta.focus();
  updateCharCount();
  queueDraftSave();
}

// ── Live/final state ──────────────────────────────────────
// Called on every poll. Owns everything that depends on whether the game has ended:
// the submit gate, the stamp button, and the Player of the Game picker.
function syncGameState(box) {
  const prev  = _gameStatus;
  _gameStatus = box ? (box.gameStatus || 0) : 0;
  const isFinal = _gameStatus === 3;

  const stamp = document.getElementById('btn-stamp');
  if (stamp) {
    stamp.style.display = _gameStatus === 2 ? '' : 'none';
    const lbl = document.getElementById('btn-stamp-label');
    const c = currentClockLabel();
    if (lbl) lbl.textContent = c || 'Stamp';
  }

  // The buzzer went while the sheet was open: reveal the picker and populate it from
  // the box score that just arrived. No re-render, so nothing typed is lost.
  const block = document.getElementById('potg-block');
  if (block) {
    block.style.display = isFinal ? '' : 'none';
    if (isFinal && prev !== 3) renderPotgSelect();
  }

  const btn = document.getElementById('btn-review-submit');
  if (btn) {
    btn.disabled = !isFinal;
    // A disabled primary button with no reason reads as a bug, so it says why.
    btn.textContent = !isFinal
      ? (_gameStatus === 2 ? 'Submit when the game ends' : 'Submit once the game starts')
      : (_isPublished ? 'Update' : 'Submit');
    btn.classList.toggle('just-final', isFinal && prev === 2);
  }
}

// ── Mark as watched ────────────────────────────────────────
async function toggleWatch() {
  const btn = document.getElementById('btn-watch');
  if (!btn) return;
  const label = document.getElementById('btn-watch-label');
  const wasOn = btn.classList.contains('on');
  // Optimistic flip
  btn.classList.toggle('on', !wasOn);
  if (label) label.textContent = !wasOn ? 'Watched' : 'Mark watched';
  _watched = !wasOn;
  try {
    const r = await fetch(`/api/games/${GAME_ID}/watch`, { method: wasOn ? 'DELETE' : 'POST' });
    if (!r.ok) throw new Error();
  } catch(e) {
    btn.classList.toggle('on', wasOn);
    if (label) label.textContent = wasOn ? 'Watched' : 'Mark watched';
    _watched = wasOn;
    showReviewToast('Could not update watched status.');
  }
}

// ── Star picker ───────────────────────────────────────────
function buildStarPicker() {
  const picker = document.getElementById('star-picker-inline');
  if (!picker || picker.dataset.built) return;

  // 5 SVG stars, each split into left/right halves via dataset
  for (let star = 1; star <= 5; star++) {
    const id  = 'gp' + star;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 20 20');
    svg.dataset.star = star;
    svg.innerHTML = `
      <defs>
        <linearGradient id="${id}" x1="0" x2="1" y1="0" y2="0">
          <stop class="sl" offset="50%" stop-color="${STAR_OFF}"/>
          <stop class="sr" offset="50%" stop-color="${STAR_OFF}"/>
        </linearGradient>
      </defs>
      <polygon points="10,2 12.4,7.8 18.5,8.2 14,12.2 15.5,18 10,14.8 4.5,18 6,12.2 1.5,8.2 7.6,7.8"
               fill="url(#${id})"/>`;
    picker.appendChild(svg);
  }

  picker.addEventListener('mousemove', e => {
    const svg = e.target.closest('svg[data-star]');
    if (!svg) return;
    const rect  = svg.getBoundingClientRect();
    const isLeft = (e.clientX - rect.left) < rect.width / 2;
    const star  = parseInt(svg.dataset.star);
    _applyPickerColors(isLeft ? star * 2 - 1 : star * 2);
  });
  picker.addEventListener('mouseleave', () => _applyPickerColors(_pickedRating));
  picker.addEventListener('click', e => {
    const svg = e.target.closest('svg[data-star]');
    if (!svg) return;
    const rect  = svg.getBoundingClientRect();
    const isLeft = (e.clientX - rect.left) < rect.width / 2;
    const star  = parseInt(svg.dataset.star);
    _pickedRating = isLeft ? star * 2 - 1 : star * 2;
    _applyPickerColors(_pickedRating);
    queueDraftSave();
  });
  picker.dataset.built = '1';
  _applyPickerColors(_pickedRating);
}

function _applyPickerColors(rating) {
  const picker = document.getElementById('star-picker-inline');
  if (!picker) return;
  picker.querySelectorAll('svg[data-star]').forEach(svg => {
    const star = parseInt(svg.dataset.star);
    const lv = star * 2 - 1, rv = star * 2;
    svg.querySelector('.sl').setAttribute('stop-color', rating >= lv ? STAR_ON : STAR_OFF);
    svg.querySelector('.sr').setAttribute('stop-color', rating >= rv ? STAR_ON : STAR_OFF);
  });
}

function applyStarColors(rating) { _applyPickerColors(rating); }

// ── Submit / Delete ───────────────────────────────────────
function updateCharCount() {
  const el = document.getElementById('review-charcount');
  if (!el) return;                       // Pro: no cap, no counter
  const n = (document.getElementById('review-textarea')?.value || '').length;
  el.className = 'review-charcount' + (n >= FREE_REVIEW_LIMIT ? ' at' : n >= FREE_REVIEW_LIMIT * 0.9 ? ' near' : '');
  // No link: subscriptions are RevenueCat/in-app only, so there is nothing on the
  // web to send them to. State the fact and leave it there.
  el.textContent = n >= FREE_REVIEW_LIMIT
    ? `${n}/${FREE_REVIEW_LIMIT} · Pro removes this limit`
    : `${n}/${FREE_REVIEW_LIMIT}`;
}

async function submitReview() {
  const btn  = document.getElementById('btn-review-submit');
  const text = document.getElementById('review-textarea')?.value.trim() || null;
  // Same rule as the app: a rating, a pick or a note is each a complete log.
  if (!_pickedRating && !_potgPick && !text) {
    showReviewToast('Rate it, pick a player, or write a note.'); return;
  }
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    // /log rather than /reviews: it is the endpoint the iOS app posts to, and the only
    // one that knows about `potg`. Sharing it is what stops the two clients drifting.
    const r = await fetch(`/api/games/${GAME_ID}/log`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({rating: _pickedRating || null, review_text: text,
                            tags: _currentTags, attended: _attended, potg: _potgPick}),
    });
    const data = await r.json();
    // The endpoint is the guarantee, not the button: it rejects a non-final game with
    // 409 so a half-formed third-quarter opinion can never reach games.rating_sum.
    if (!r.ok) throw new Error(data.message || data.error);
    // Publishing DELETES the draft inside the same transaction. A debounced PUT still
    // pending here would recreate it a second later, and that zombie draft would then
    // beat the published log on the next load. Cancel it before anything else.
    if (_draftTimer) { clearTimeout(_draftTimer); _draftTimer = null; }
    _draftDirty = false;
    setDraftState('');
    _isPublished = true;
    showReviewToast('Log saved!');
    // Deliberately NOT clearing _pickedRating: the sheet should now show what you
    // published, not an empty form. Reloading re-seeds it from the server.
    _reviewOffset = 0;
    _panelsLoaded = false;
    loadGamePanels(false);
  } catch(e) {
    showReviewToast('Error: ' + e.message);
    btn.disabled = false; btn.textContent = _isPublished ? 'Update' : 'Submit';
  }
}

// ── Reply helpers ──────────────────────────────────────────
function _replyAvatarEl(name, avatarUrl) {
  const initials = name ? name[0].toUpperCase() : '?';
  const img = avatarUrl
    ? `<img src="${avatarUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" onerror="this.style.display='none'">`
    : '';
  return `<div class="reply-avatar">${img || initials}</div>`;
}

function _replyItemHTML(reply, reviewId, currentUserId) {
  const isOwn = currentUserId && reply.user_id === currentUserId;
  const delBtn = isOwn
    ? `<button class="btn-delete-reply" data-review-id="${reviewId}" data-reply-id="${reply.id}" title="Delete">×</button>`
    : '';
  return `<div class="reply-item" data-reply-id="${reply.id}">
    ${_replyAvatarEl(reply.display_name, reply.avatar_url)}
    <div class="reply-body">
      <div class="reply-meta">
        <a href="/profile/${reply.user_id}" class="reply-name" onclick="event.stopPropagation()">${reply.display_name}</a>
        <span class="reply-date">${fmtShortDate(reply.created_at)}</span>
        ${delBtn}
      </div>
      <p class="reply-text">${reply.reply_text}</p>
    </div>
  </div>`;
}

function _renderReplySection(section, replies, total) {
  const reviewId = parseInt(section.dataset.reviewId);
  const offset   = parseInt(section.dataset.offset || 0);
  const remaining = total - offset;
  const uid = _reviewUser ? _reviewUser.id : null;

  const threadHtml = replies.map(r => _replyItemHTML(r, reviewId, uid)).join('');
  const showMore = remaining > 0
    ? `<button class="btn-show-more-replies" data-review-id="${reviewId}">Show ${remaining} more repl${remaining === 1 ? 'y' : 'ies'}</button>`
    : '';
  const form = _reviewUser
    ? `<div class="reply-form">
         <input class="reply-input" type="text" placeholder="Write a reply…" maxlength="1000">
         <button class="btn-send-reply">Post</button>
       </div>`
    : `<div class="reply-sign-in"><a href="/auth/google/login?next=${encodeURIComponent(window.location.pathname + window.location.search)}" style="color:var(--orange)">Sign in</a> to reply</div>`;

  section.innerHTML = `<div class="reply-thread" id="reply-thread-${reviewId}">${threadHtml}</div>${showMore}${form}`;
}

async function toggleReplies(reviewId) {
  const section = document.getElementById(`reply-section-${reviewId}`);
  if (!section) return;
  if (section.classList.contains('open')) {
    section.classList.remove('open');
    return;
  }
  section.classList.add('open');
  if (section.dataset.loaded === '1') return;
  section.innerHTML = '<div class="reply-loading">Loading…</div>';
  try {
    const data = await fetch(`${API}/api/reviews/${reviewId}/replies?limit=3&offset=0`).then(r => r.json());
    const replies = data.replies || [];
    section.dataset.loaded  = '1';
    section.dataset.total   = data.total || 0;
    section.dataset.offset  = replies.length;
    _renderReplySection(section, replies, data.total || 0);
  } catch { section.innerHTML = '<div class="reply-loading">Could not load replies.</div>'; }
}

async function loadMoreReplies(reviewId) {
  const section = document.getElementById(`reply-section-${reviewId}`);
  if (!section) return;
  const offset = parseInt(section.dataset.offset || 0);
  const data = await fetch(`${API}/api/reviews/${reviewId}/replies?limit=10&offset=${offset}`).then(r => r.json());
  const replies = data.replies || [];
  const newOffset = offset + replies.length;
  section.dataset.offset = newOffset;
  section.dataset.total  = data.total || 0;
  const thread = section.querySelector(`#reply-thread-${reviewId}`);
  const uid = _reviewUser ? _reviewUser.id : null;
  replies.forEach(r => thread.insertAdjacentHTML('beforeend', _replyItemHTML(r, reviewId, uid)));
  const btn = section.querySelector('.btn-show-more-replies');
  const remaining = (data.total || 0) - newOffset;
  if (remaining > 0) {
    if (btn) btn.textContent = `Show ${remaining} more repl${remaining === 1 ? 'y' : 'ies'}`;
  } else {
    if (btn) btn.remove();
  }
}

async function submitReply(reviewId, inputEl) {
  if (!inputEl) return;
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.disabled = true;
  try {
    const res = await fetch(`${API}/api/reviews/${reviewId}/replies`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reply_text: text }),
    });
    if (!res.ok) { inputEl.disabled = false; return; }
    const reply = await res.json();
    if (!reply.avatar_url && _reviewUser) reply.avatar_url = _reviewUser.avatar_url;
    const section = document.getElementById(`reply-section-${reviewId}`);
    const thread  = section.querySelector(`#reply-thread-${reviewId}`);
    const uid = _reviewUser ? _reviewUser.id : null;
    thread.insertAdjacentHTML('beforeend', _replyItemHTML(reply, reviewId, uid));
    section.dataset.offset = parseInt(section.dataset.offset || 0) + 1;
    section.dataset.total  = parseInt(section.dataset.total  || 0) + 1;
    inputEl.value = '';
    inputEl.disabled = false;
    inputEl.focus();
  } catch { inputEl.disabled = false; }
}

async function deleteReply(reviewId, replyId, itemEl) {
  if (!itemEl) return;
  const res = await fetch(`${API}/api/reviews/${reviewId}/replies/${replyId}`, { method: 'DELETE' });
  if (!res.ok) return;
  itemEl.remove();
  const section = document.getElementById(`reply-section-${reviewId}`);
  if (section) {
    section.dataset.offset = Math.max(0, parseInt(section.dataset.offset || 0) - 1);
    section.dataset.total  = Math.max(0, parseInt(section.dataset.total  || 0) - 1);
  }
}

async function deleteReview() {
  if (!confirm('Delete your log?')) return;
  try {
    const r = await fetch(`/api/games/${GAME_ID}/reviews`, {method:'DELETE'});
    if (!r.ok) throw new Error((await r.json()).error);
    // Same zombie-draft hazard as publishing: kill the pending write, and drop the
    // draft too, or the deleted log reappears from the notebook on next open.
    if (_draftTimer) { clearTimeout(_draftTimer); _draftTimer = null; }
    _draftDirty = false;
    try { await fetch(`/api/games/${GAME_ID}/draft`, {method:'DELETE'}); } catch {}
    showReviewToast('Log deleted.');
    _isPublished = false;
    _reviewOffset = 0; _pickedRating = 0;
    const ta = document.getElementById('review-textarea');
    if (ta) ta.value = '';
    _panelsLoaded = false;
    loadGamePanels(false);
  } catch(e) { showReviewToast('Error: ' + e.message); }
}

function showReviewToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#0c0c0d;color:#fff;font-size:13px;padding:9px 16px;border-radius:4px;z-index:9999;font-family:var(--ff-sans);animation:fadeUp 0.2s ease';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// ── Stat tag system ────────────────────────────────────────
const STAT_OPTS = [
  { key: 'points',            label: 'PTS', fmt: s => s.points },
  { key: 'reboundsTotal',     label: 'REB', fmt: s => s.reboundsTotal },
  { key: 'assists',           label: 'AST', fmt: s => s.assists },
  { key: 'steals',            label: 'STL', fmt: s => s.steals },
  { key: 'blocks',            label: 'BLK', fmt: s => s.blocks },
  { key: 'turnovers',         label: 'TOV', fmt: s => s.turnovers },
  { key: 'threePointersMade', label: '3PM', fmt: s => `${s.threePointersMade}/${s.threePointersAttempted}` },
  { key: 'fieldGoalsMade',    label: 'FG',  fmt: s => `${s.fieldGoalsMade}/${s.fieldGoalsAttempted}` },
  { key: 'freeThrowsMade',    label: 'FT',  fmt: s => `${s.freeThrowsMade}/${s.freeThrowsAttempted}` },
  { key: 'plusMinusPoints',   label: '+/-', fmt: s => { const v = +s.plusMinusPoints; return v >= 0 ? `+${v}` : `${v}`; } },
];

function _esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function _headshotUrl(pid) {
  return IS_WNBA
    ? `https://ak-static.cms.nba.com/wp-content/uploads/headshots/wnba/latest/260x190/${pid}.png`
    : `https://cdn.nba.com/headshots/nba/latest/260x190/${pid}.png`;
}
function _teamLogoUrl(abbr) {
  const id = TEAM_IDS[abbr];
  return id ? `https://cdn.nba.com/logos/nba/${id}/global/L/logo.svg` : '';
}
function _parseMins(str) {
  const m = String(str || '').match(/PT(\d+)M/);
  return m ? parseInt(m[1]) : 0;
}

const _PERSON_SVG = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="10" cy="6.5" r="3"/>
  <path d="M3 18c0-3.866 3.134-7 7-7s7 3.134 7 7"/>
</svg>`;

function tagPillHTML(t) {
  return `<span class="review-tag">
    <img class="tag-headshot" src="${_headshotUrl(t.player_id)}" onerror="this.style.display='none'" alt="">
    <span class="tag-val">${_esc(t.stat_display)}</span>
    <span class="tag-lbl">${_esc(t.stat_label)}</span>
  </span>`;
}

function renderWriteTags() {
  const row = document.getElementById('write-tags-row');
  if (!row) return;
  let html = _currentTags.map((t, i) => `
    <span class="write-tag">
      <img class="tag-headshot" src="${_headshotUrl(t.player_id)}" onerror="this.style.display='none'" alt="">
      <span class="tag-val">${_esc(t.stat_display)}</span>
      <span class="tag-lbl">${_esc(t.stat_label)}</span>
      <button class="write-tag-x" data-tag-idx="${i}" title="Remove">×</button>
    </span>`).join('');
  if (_currentTags.length < 5) {
    html += `<button class="btn-add-tag" id="btn-add-tag" title="Add a stat context tag">+</button>`;
  }
  row.innerHTML = html;
  const addBtn = document.getElementById('btn-add-tag');
  if (addBtn) addBtn.addEventListener('click', e => { e.stopPropagation(); openTagPicker(addBtn); });
  row.querySelectorAll('.write-tag-x').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      _currentTags.splice(parseInt(btn.dataset.tagIdx), 1);
      renderWriteTags();
    });
  });
}

function closeTagPicker() {
  if (_pickerEl) { _pickerEl.remove(); _pickerEl = null; }
  document.removeEventListener('click', _pickerOutsideClick, true);
}

function _pickerOutsideClick(e) {
  if (_pickerEl && !_pickerEl.contains(e.target)) {
    const addBtn = document.getElementById('btn-add-tag');
    if (addBtn && addBtn.contains(e.target)) return;
    closeTagPicker();
  }
}

function _positionPicker(anchor) {
  if (!_pickerEl || !anchor) return;
  const rect = anchor.getBoundingClientRect();
  let top = rect.bottom + 6, left = rect.left;
  if (left + 272 > window.innerWidth - 8) left = window.innerWidth - 272 - 8;
  if (left < 8) left = 8;
  if (top + 290 > window.innerHeight - 8) top = rect.top - 290 - 6;
  _pickerEl.style.top = top + 'px';
  _pickerEl.style.left = left + 'px';
}

async function openTagPicker(anchor) {
  closeTagPicker();
  _pickerEl = document.createElement('div');
  _pickerEl.className = 'tag-picker';
  _pickerEl.innerHTML = `<div class="tag-picker-msg">Loading…</div>`;
  document.body.appendChild(_pickerEl);
  _positionPicker(anchor);
  setTimeout(() => document.addEventListener('click', _pickerOutsideClick, true), 10);

  if (!_boxscoreData) {
    const res = await fetch(`/api/live/boxscore/${GAME_ID}`);
    if (res.ok) _boxscoreData = await res.json();
  }
  if (!_boxscoreData) {
    _pickerEl.innerHTML = `<div class="tag-picker-msg">Could not load boxscore.</div>`;
    return;
  }
  if (!_pickerActiveTeam) _pickerActiveTeam = _boxscoreData.awayTeam?.teamTricode;
  _pickerSelectedPlayer = null;
  _pickerEl.addEventListener('click', _pickerClick);
  _renderPickerContent();
}

function _pickerClick(e) {
  const tab = e.target.closest('.tag-picker-tab');
  if (tab) { _pickerActiveTeam = tab.dataset.team; _pickerSelectedPlayer = null; _renderPickerContent(); return; }
  const back = e.target.closest('.tag-picker-back');
  if (back) { _pickerSelectedPlayer = null; _renderPickerContent(); return; }
  const playerRow = e.target.closest('.tag-picker-player');
  if (playerRow) { _pickerSelectedPlayer = _pickerPlayers[parseInt(playerRow.dataset.idx)]; _renderPickerContent(); return; }
  const statRow = e.target.closest('.tag-picker-stat');
  if (statRow) { _confirmStatTag(parseInt(statRow.dataset.idx)); return; }
}

function _renderPickerContent() {
  if (!_pickerEl || !_boxscoreData) return;
  const away = _boxscoreData.awayTeam, home = _boxscoreData.homeTeam;
  const isAway = _pickerActiveTeam === away.teamTricode;
  const activeTeam = isAway ? away : home;

  const tabsHtml = `<div class="tag-picker-tabs">
    <button class="tag-picker-tab${isAway?' active':''}" data-team="${_esc(away.teamTricode)}">
      <img src="${_teamLogoUrl(away.teamTricode)}" width="16" height="16" style="object-fit:contain" onerror="this.style.display='none'"> ${_esc(away.teamTricode)}
    </button>
    <button class="tag-picker-tab${!isAway?' active':''}" data-team="${_esc(home.teamTricode)}">
      <img src="${_teamLogoUrl(home.teamTricode)}" width="16" height="16" style="object-fit:contain" onerror="this.style.display='none'"> ${_esc(home.teamTricode)}
    </button>
  </div>`;

  if (_pickerSelectedPlayer) {
    const p = _pickerSelectedPlayer, s = p.statistics || {};
    _pickerStats = STAT_OPTS.map(opt => {
      let val; try { val = String(opt.fmt(s)); } catch { val = '—'; }
      return { ...opt, display: val };
    });
    const statsHtml = _pickerStats.map((opt, i) =>
      `<div class="tag-picker-stat" data-idx="${i}">
        <span class="tps-label">${_esc(opt.label)}</span>
        <span class="tps-val">${_esc(opt.display)}</span>
      </div>`).join('');
    _pickerEl.innerHTML = `${tabsHtml}
      <div class="tag-picker-body">
        <button class="tag-picker-back">← ${_esc(p.name)}</button>
        ${statsHtml}
      </div>`;
  } else {
    _pickerPlayers = (activeTeam.players || []).filter(p => _parseMins(p.statistics?.minutes) >= 1);
    const playersHtml = _pickerPlayers.length
      ? _pickerPlayers.map((p, i) =>
          `<div class="tag-picker-player" data-idx="${i}">
            <img class="tp-headshot" src="${_headshotUrl(p.personId)}" onerror="this.src=''" alt="">
            <span class="tp-name">${_esc(p.name)}</span>
            <span class="tp-mins">${_parseMins(p.statistics?.minutes)}m</span>
          </div>`).join('')
      : `<div class="tag-picker-msg">No players found.</div>`;
    _pickerEl.innerHTML = `${tabsHtml}<div class="tag-picker-body">${playersHtml}</div>`;
  }
  _pickerEl.addEventListener('click', _pickerClick);
}

function _confirmStatTag(idx) {
  const opt = _pickerStats[idx], player = _pickerSelectedPlayer;
  if (!opt || !player) return;
  if (_currentTags.length >= 5) { showReviewToast('Max 5 tags per review.'); closeTagPicker(); return; }
  const dup = _currentTags.find(t => t.player_id === String(player.personId) && t.stat_label === opt.label);
  if (!dup) {
    _currentTags.push({
      player_id:    String(player.personId),
      player_name:  player.name,
      team_abbr:    _pickerActiveTeam,
      stat_label:   opt.label,
      stat_display: opt.display,
    });
  }
  renderWriteTags();
  closeTagPicker();
}

async function shareReviewItem(item, btn) {
  const isDark = document.documentElement.classList.contains('night-mode');
  const bgColor = isDark ? '#222228' : '#F5F0E8';

  const wrapper = document.createElement('div');
  Object.assign(wrapper.style, {
    position: 'fixed', top: '-9999px', left: '-9999px',
    width: item.offsetWidth + 'px',
    background: bgColor,
    padding: '20px',
    borderRadius: '12px',
    boxSizing: 'border-box',
    fontFamily: 'Instrument Sans, sans-serif',
  });

  const clone = item.cloneNode(true);
  clone.style.cssText = '';
  const footer = clone.querySelector('.review-footer');
  if (footer) footer.remove();
  clone.querySelector('.review-tags')?.remove();
  clone.querySelector('.avatar-team-badge')?.remove();
  wrapper.appendChild(clone);

  const brand = document.createElement('div');
  Object.assign(brand.style, {
    marginTop: '14px', fontSize: '11px', color: isDark ? '#888' : '#aaa',
    textAlign: 'right', fontFamily: 'DM Mono, monospace',
  });
  brand.textContent = 'ydkball.net';
  wrapper.appendChild(brand);

  document.body.appendChild(wrapper);

  const origHTML = btn.innerHTML;
  btn.textContent = '…';
  btn.disabled = true;

  try {
    await preloadImages(wrapper);
    const canvas = await html2canvas(wrapper, {
      useCORS: true,
      scale: 2,
      backgroundColor: bgColor,
    });
    document.body.removeChild(wrapper);
    canvas.toBlob(async blob => {
      try {
        const file = new File([blob], 'review.png', { type: 'image/png' });
        if (navigator.canShare?.({ files: [file] })) {
          await navigator.share({ files: [file] });
        } else {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        }
        btn.classList.add('copied');
        btn.innerHTML = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10l4 4 8-8"/></svg>`;
        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = origHTML; btn.disabled = false; }, 2000);
      } catch (err) {
        if (err.name !== 'AbortError') window.open(canvas.toDataURL(), '_blank');
        btn.innerHTML = origHTML;
        btn.disabled = false;
      }
    });
  } catch {
    if (document.body.contains(wrapper)) document.body.removeChild(wrapper);
    btn.innerHTML = origHTML;
    btn.disabled = false;
  }
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
